name: Android widget APK

# Compila el APK del widget de Metro en los servidores de GitHub (no hace falta Android Studio).
#   - A mano: Actions → «Android widget APK» → Run workflow → el APK sale en «Artifacts» al final de la ejecución.
#   - Con una etiqueta `android-v0.1.0`: además crea una Release con el APK adjunto (enlace de descarga fijo).
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
    branches: ['android-widget']
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar clave de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Con los secretos, la clave es siempre la misma y cada APK se instala encima del anterior.
          # Sin ellos se genera una clave temporal: el APK funciona, pero para actualizar hay que desinstalar el anterior.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bt.keystore"
            echo "::add-mask::$KS_PASS"
            echo "BT_STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "BT_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          else
            TMP_PASS="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
            echo "::add-mask::$TMP_PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/bt.keystore" -storepass "$TMP_PASS" -keypass "$TMP_PASS" -alias bilbotrans -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BilboTrans"
            echo "BT_STORE_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "BT_KEY_ALIAS=bilbotrans" >> "$GITHUB_ENV"
          fi
          echo "BT_KEYSTORE=$RUNNER_TEMP/bt.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        run: |
          set +e
          gradle -p android assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # El log completo exige iniciar sesión en GitHub: los errores del compilador se repiten como anotaciones (públicas)
            grep -E "^e: " build.log | head -15 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "What went wrong" -A2 build.log | head -6 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk BilboTrans-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BilboTrans-widget-apk
          path: BilboTrans-widget.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: BilboTrans-widget.apk
          generate_release_notes: true
